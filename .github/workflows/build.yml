name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Install unzip & extract project
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        for f in *.zip; do
          if [ -f "$f" ]; then
            unzip -o "$f"
          fi
        done

    - name: Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} +

    - name: Build Debug APK
      run: |
        GW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GW_PATH" ]; then
          cd $(dirname "$GW_PATH")
          ./gradlew assembleDebug --stacktrace
        else
          BG_PATH=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -n "$BG_PATH" ]; then
            cd $(dirname "$BG_PATH")
            gradle assembleDebug --stacktrace
          else
            echo "Error: Could not find build.gradle file!"
            exit 1
          fi
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhosImposter-APK
        path: '**/*.apk'

