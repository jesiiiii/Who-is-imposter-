name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project if uploaded as zip
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          unzip -o *.zip
        fi

    - name: Build APK
      run: |
        GW=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GW" ]; then
          DIR=$(dirname "$GW")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle build
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WhosImposter-APK
        path: '**/build/outputs/apk/debug/*.apk'
